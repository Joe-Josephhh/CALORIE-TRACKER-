{% extends "base.html" %}

{% block title %}
Log In - Calorie Tracker
{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card auth-card-narrow">
        <div class="auth-header">
            <span class="auth-icon">🔐</span>
            <h1>Welcome Back</h1>
            <p>Log in to view your personal dashboard, food diary, and exercise logs.</p>
        </div>

        <form action="{{ url_for('login') }}" method="POST" class="auth-form">
            <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
            <div class="form-group">
                <label for="identifier">Email or Username <span class="required">*</span></label>
                <input
                    type="text"
                    id="identifier"
                    name="identifier"
                    value="{{ identifier if identifier else '' }}"
                    placeholder="Enter your email or username"
                    required
                    autocomplete="username"
                >
            </div>

            <div class="form-group">
                <label for="password">Password <span class="required">*</span></label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                    autocomplete="current-password"
                >
            </div>

            <button type="submit" class="button auth-submit-btn">
                Log In
            </button>
        </form>

        <div class="auth-footer">
            <p>Don't have an account yet? <a href="{{ url_for('register') }}">Create an account</a></p>
        </div>
    </div>
</div>
{% endblock %}
